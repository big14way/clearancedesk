# Files for the "Clearance Desk — Admission Policy" Knowledge Base (Sanity Context, Phase 3).
# Each entry points at a source in data/sources.yaml. scripts/build-kb-files.ts turns it into an upload file in
# data/raw/kb/ (gitignored): HTML pages become clean Markdown with a source header (title, URL, publisher, authority,
# dates) so Knowledge Base entries can cite the original; PDFs are copied as-is, or reduced to the relevant pages.
#   mode: html       — main text of a saved web page
#   mode: pdf        — the whole PDF
#   mode: pdf-pages  — only `pages` (1-based PDF page numbers), extracted as text, two-column pages split by `columns`

