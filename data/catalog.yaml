    programme: unilag-medicine-and-surgery
    session: "2026/2027"
    utmeCompulsory: [english, biology, chemistry, physics]
    utmeChoices: []
    utmeMinScore: 200
    lastCutoff: null
    olevelMinCredits: 5
    olevelCompulsory: [{subject: english}, {subject: mathematics}, {subject: biology}, {subject: chemistry}, {subject: physics}]
    olevelChoices: []
    olevelOtherSubjectsCount: false
    olevelMaxSittings: 1
    olevelAcceptedExams: [WAEC, NECO, GCE]
    specialConditions:
      - "UNILAG's published 2026/2027 'UTME merit cut-off mark' for Medicine & Surgery was 83.425. The page does not say what scale this is on (it is not a UTME score out of 400)."
