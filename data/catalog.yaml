  - id: unilag-law-2026-2027
    programme: unilag-law
    session: "2026/2027"
    utmeCompulsory: [english]
    # UNILAG approved Arts + Social Science subjects (JAMB §2.2.03 III), minus Fine Arts (UNILAG does not accept it for Law); Language Arts is not a UTME subject
    utmeChoices: [{pick: 3, from: [literature-in-english, arabic, history, crs, irs, igbo, hausa, yoruba, french, economics, government, geography, commerce]}]
    utmeMinScore: 200
    lastCutoff: null
    olevelMinCredits: 5
    olevelCompulsory: [{subject: english}, {subject: mathematics}, {subject: literature-in-english}]
    olevelChoices: [{pick: 2, from: [arabic, history, crs, irs, igbo, hausa, yoruba, french, fine-arts, economics, government, geography, commerce], minGrade: C6}]
    olevelOtherSubjectsCount: false
    olevelMaxSittings: 1
    olevelAcceptedExams: [WAEC, NECO, GCE]
    specialConditions:
      - "UTME: UNILAG accepts Economics or Commerce, but not both."
      - "UNILAG's published 2026/2027 'UTME merit cut-off mark' for Law was 79.125. The page does not say what scale this is on (it is not a UTME score out of 400)."
      - *unilag-conditions
    citations:
      - {source: src-jamb-ibass-unilag, locator: "LAW (IBASS programme 14969): UTME subjects; UTME (O'level) requirements. Entry updated 2023-07-25"}
      - {source: src-unilag-2025-admission-requirements, locator: "p. 18, LAW row"}
      - {source: src-jamb-brochure-specific-entry, locator: "§2.2.03 University of Lagos (i) and III (a) Approved Arts, (c) Approved Social Science subjects, PDF pp. 3–4"}
      - {source: src-unilag-2026-post-utme-notice, locator: "ELIGIBLE CANDIDATES, paras. 1–4 (UTME 200 and above; five credits at one sitting; age; compulsory Post-UTME test)"}
      - {source: src-unilag-2026-olevel-upload-extension, locator: "para. 1"}
      - {source: src-unilag-2026-merit-cutoffs, locator: "2026/2027 merit cut-off table, LAW, MERIT column"}
    verificationStatus: conflicting
    lastVerified: "2026-10-03"
    conflictNote: >
      JAMB's brochure (IBASS 14969, updated 2023) says UNILAG accepts Principles of Accounting in UTME and allows
      "Principles of Accounting and any one Arts/Social Science subject" at O'level, and limits UTME to ONE of
      Economics, Commerce or Accounting. UNILAG's own 2025/2026 requirements (p. 18) say UNILAG does NOT accept
      Principles of Accounting and accepts Economics or Commerce but not both. We encode the stricter rule:
      Principles of Accounts is not counted for UTME or O'level.

