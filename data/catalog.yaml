# Clearance Desk catalog. Every requirement is drafted ONLY from the sources in data/sources.yaml.
# Conventions:
#   - Grades default to C6 (credit). Session 2026/2027 = applicants sitting UTME 2026.
#   - When two official sources disagree, verificationStatus is `conflicting`, conflictNote names both,
#     and the STRICTER rule is encoded (safe for candidates).
#   - Things code cannot check (age, post-UTME, "at most one of X/Y", aggregate cut-offs) go in specialConditions.
#   - "Use of English" (UTME) and "English Language" (O'level) are the same subject id: english. Use of English is
#     compulsory for every UTME candidate (src-jamb-2024-utme-manual), so it is a UTME subject even where a JAMB entry
#     lists only the other three.

subjects:
  # UTME subjects (JAMB IBASS e-syllabus list) plus O'level-only subjects that appear in the requirements.
