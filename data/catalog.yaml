      - {source: src-unilag-2026-olevel-upload-extension, locator: "para. 1 (WAEC, NECO, GCE and Cambridge O'Level results)"}
      - {source: src-unilag-2026-merit-cutoffs, locator: "2026/2027 merit cut-off table, MEDICINE & SURGERY, MERIT column"}
