# ------------------------------------------------------------------------------------------------
# Shared rule text (YAML anchors keep each institution's common conditions identical)
# ------------------------------------------------------------------------------------------------
x-unilag-conditions: &unilag-conditions
  - "UNILAG must be your first choice in the 2026/2027 UTME."
  - "You must sit UNILAG's Post-UTME online aptitude test; candidates who miss it are not considered."
  - "You must be at least 16 years old by 30 September 2026."
  - "O'level results had to be uploaded on JAMB CAPS and the UNILAG portal by 24 August 2026."
  - "UNILAG also accepts Cambridge O'Level results, which this checker cannot model; confirm with UNILAG if you are using one."
x-unn-conditions: &unn-conditions
  - "UNN must be your first choice in the 2026 UTME."
  - "You must take UNN's Post-UTME screening. UNN suspended the 2026 online test on 21 August 2026 for technical reasons; check unn.edu.ng for the new date."
  - "You must be at least 16 years old by 30 September 2026."
  - "UNN publishes no departmental cut-off marks, and in 2017 it publicly disowned unofficial cut-off lists."
x-unn-science-note: &unn-science-note "UNN's approved Science list also includes subjects this checker does not list separately (e.g. Statistics, General Science, Integrated Science, Human Biology, Physics with Chemistry). If your science credit is one of those, confirm with UNN."
x-oau-conditions: &oau-conditions
  - "OAU must be your first choice in the 2026 UTME."
  - "You must attend OAU's Post-UTME screening in person (rescheduled to 25–30 September 2026)."
  - "OAU's 2026 notices publish no departmental cut-off marks, and its detailed 2026 eligibility guidelines page (eportal2.oauife.edu.ng) could not be read. Check both with OAU."
x-lasu-conditions: &lasu-conditions
  - "LASU must be your first choice in the 2026 UTME."
  - "You must be at least 16 years old by 1 October 2026."
  - "You must complete LASU's mandatory online admission screening (it closed on 14 July 2026 and reopened 6–9 August only for candidates whose awaited results had been released) and upload your O'level results on JAMB CAPS."
  - "LASU ranks candidates by points (UTME score plus your five best relevant O'level grades) and publishes no departmental cut-offs."
  - "O'level results from exams taken after July 2026 are not accepted."
  - "LASU names only 'SSCE (or equivalent)' results; it does not say whether GCE or NABTEB count, so confirm with LASU if yours is one of those."
x-ui-conditions: &ui-conditions
  - "You must sit UI's Post-UTME examination (held 27–29 July 2026)."
  - "UI's 2026 documents name only WAEC and NECO results. They say nothing about GCE or NABTEB for UTME candidates, so confirm with UI if your result is GCE or NABTEB."
  - "You must be at least 16 years old by 30 September 2026."

requirements:
  # ============================================================== UNIVERSITY OF LAGOS
